[project]
site_name = "Isotope eCommerce Documentation"
site_url = "https://docs.isotopeecommerce.org/en/"
docs_dir = "docs/en"
site_dir = ".build"
strict = true

repo_name = "isotope/docs3"
repo_url = "https://github.com/isotope/docs3"
edit_uri = "edit/main/docs/en/"

copyright = "&copy; 2026 terminal42 gmbh"

nav = [
    { "Getting started" = [
        { "Welcome" = "index.md" },
        { "Start here" = "getting-started/index.md" },
        { "Why Isotope?" = "getting-started/why.md" },
        { "Installation" = "getting-started/installation.md" },
        { "Your first shop" = "guides/first-shop.md" },
        { "License and support" = "getting-started/license.md" },
    ]},
    { "Concepts" = [
        { "How a shop works" = "concepts/shop.md" },
        { "Contao essentials" = "concepts/contao.md" },
        { "Prices and taxes" = "concepts/prices-and-taxes.md" },
        { "Glossary" = "concepts/glossary.md" },
    ]},
    { "Setup" = [
        { "Setup roadmap" = "setup/index.md" },
        { "Products" = [
            { "Product types" = "setup/products/types.md" },
            { "Attributes and options" = "setup/products/attributes.md" },
            { "Related products" = "setup/products/relations.md" },
            { "Base prices" = "setup/products/base-prices.md" },
        ]},
        { "Storefront" = [
            { "Displaying products" = "setup/frontend/products.md" },
            { "Cart and checkout" = "setup/frontend/checkout.md" },
            { "Members and guests" = "setup/frontend/customers.md" },
        ]},
        { "Checkout configuration" = [
            { "Shipping methods" = "setup/checkout/shipping.md" },
            { "Payment methods" = "setup/checkout/payment.md" },
            { "Tax classes" = "setup/checkout/tax-classes.md" },
            { "Tax rates" = "setup/checkout/tax-rates.md" },
        ]},
        { "Rules" = "setup/rules.md" },
        { "General settings" = [
            { "Store configurations" = "setup/general/stores.md" },
            { "Order statuses" = "setup/general/order-status.md" },
            { "Notifications" = "setup/general/notifications.md" },
            { "Documents" = "setup/general/documents.md" },
            { "Galleries" = "setup/general/galleries.md" },
            { "Staff access" = "setup/general/access.md" },
        ]},
        { "Bundle configuration" = "getting-started/bundle-configuration.md" },
    ]},
    { "Daily work" = [
        { "Overview" = "usage/index.md" },
        { "Products" = "usage/products.md" },
        { "Variants" = "usage/variants.md" },
        { "Prices" = "usage/prices.md" },
        { "Processing orders" = "usage/orders.md" },
        { "Returns and refunds" = "usage/returns.md" },
    ]},
    { "Guides" = [
        { "Guide index" = "guides/index.md" },
        { "Worked tax example" = "guides/tax-example.md" },
        { "Pricing recipes" = "guides/pricing.md" },
        { "Shipping recipes" = "guides/shipping.md" },
        { "International shops" = "guides/international.md" },
        { "Simple tokens" = "guides/simple-tokens.md" },
        { "Launch checklist" = "guides/launch.md" },
        { "Troubleshooting" = "guides/troubleshooting.md" },
        { "Performance" = "guides/performance.md" },
        { "Maintenance" = "guides/maintenance.md" },
        { "Upgrading" = "guides/upgrading.md" },
    ]},
    { "Developers" = [
        { "Overview" = "developers/index.md" },
        { "Twig templates" = "developers/templates.md" },
        { "Events" = "developers/events.md" },
        { "Extensions" = "developers/extensions.md" },
    ]},
    { "Reference" = [
        { "Version notes" = "reference/version-notes.md" },
        { "Source map" = "reference/source-map.md" },
    ]},
]

[project.extra]
homepage = "/en/"
alternate = [
    { name = "English", link = "/en/", lang = "en" },
]

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
    "navigation.tabs",
    "navigation.sections",
#    "navigation.prune",
    "navigation.indexes",
    "content.code.copy",
]

[project.markdown_extensions.pymdownx.quotes]
callouts = true

[project.markdown_extensions]
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.tables]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
