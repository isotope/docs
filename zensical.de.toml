[project]
site_name = "Isotope eCommerce Dokumentation"
site_url = "https://docs.isotopeecommerce.org/de/"
docs_dir = "docs/de"
site_dir = ".build/de"
strict = true
extra_css = ["assets/stylesheets/isotope.css"]

repo_name = "isotope/docs"
repo_url = "https://github.com/isotope/docs"
edit_uri = "edit/main/docs/de/"

copyright = "&copy; 2026 terminal42 gmbh"

nav = [
